# Preset: TikTok / Shorts dọc 30–60 s
# Chuyển từ Documents/Tiktok/.agents/skills/tiktok-ai-video/SKILL.md (Workflow 1–11)
id: tiktok-short
name: TikTok short dọc
channel: tiktok
format: short
project_dir: ~/Documents/Tiktok/ai-video-projects/{slug}
skills:
  - ~/Documents/Tiktok/.agents/skills/tiktok-ai-video
vars:
  duration: 45
  size: 1080x1920

permissions:
  allow: ["Edit", "Write", "Read", "Bash(python3 *)", "Bash(ffmpeg *)"]
  ask: ["Bash(*elevenlabs*)", "Bash(*rw-generate*)", "Bash(rm *)"]
  deny: ["Bash(git push*)", "Bash(sudo *)"]

defaults:
  gate: { mode: auto_after, after: 20m }
  timeout: 1h

steps:
  - id: hook
    name: Lời hứa & 3 hook
    prompt: |
      Biến ý tưởng "{title}" thành 1 câu hứa cho 1 nhóm khán giả, viết 3 hook, chọn hook mạnh nhất,
      viết lời đọc ~{vars.duration}s. {feedback}
    outputs: [script.md]
    gate: { mode: manual }

  - id: bible
    name: Visual bible & project.json
    prompt: |
      Viết visual bible (chủ thể, nhân vật lặp lại, bối cảnh, màu, ánh sáng, ống kính). Tạo project.json từ template. {feedback}
    outputs: [project.json, bible.md]
    checks:
      - name: validate_project
        run: python3 {skill}/scripts/validate_project.py project.json
    gate: { mode: auto_if_checks }

  - id: images
    name: Ảnh tham chiếu & cảnh
    prompt: |
      Tạo ảnh master rồi ảnh từng cảnh dọc. Trước khi generate trả phí: studio_cost_request. Không chữ, logo, người thật. {feedback}
    outputs: ["images/*.png"]
    cost: { service: image-gen, estimate: "count(scenes)", always_ask: true }
    gate: { mode: manual }

  - id: voice
    name: Giọng & phụ đề
    prompt: |
      Tạo lời đọc + SRT từ cùng kịch bản đã duyệt. studio_cost_request trước khi tốn credit. {feedback}
    outputs: ["audio/*.wav", "*.srt"]
    cost: { service: elevenlabs, estimate: "chars(script.md)", always_ask: true }
    gate: { mode: manual }

  - id: render
    name: Dựng video
    prompt: |
      Ghép bằng scripts/render_video.py, {vars.size}. Kiểm 2 giây đầu, vùng an toàn phụ đề, nhịp, cân âm. {feedback}
    outputs: ["exports/*.mp4"]
    resources: [render]
    checks:
      - name: validate assets
        run: python3 {skill}/scripts/validate_project.py project.json --check-assets
    gate: { mode: manual }

  - id: deliver
    name: Gói đăng
    prompt: |
      Xuất video + chữ bìa, caption, hashtag, prompt nguồn, phụ đề vào videos/. Nhãn AI.
    outputs: ["exports/caption.md"]
    checks:
      - name: Đủ file gói đăng
        run: studio-check outputs
    gate: { mode: auto_if_checks }
